[project]
name = "auto-stock-db"
version = "0.1.0"
description = "Demand Intelligence Server — 날짜 기반 스톡 이미지 idea card 생성/저장 서버"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.10.0",
    "supabase>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0",
    "rich>=13.0.0",
    "isoweek>=1.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/central"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
